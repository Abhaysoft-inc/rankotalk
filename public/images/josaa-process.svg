<svg xmlns="http://www.w3.org/2000/svg" width="480" height="546" viewBox="0 0 480 546" role="img" aria-labelledby="t"><title id="t">The JoSAA counselling process in six steps</title><rect width="480" height="546" fill="#ffffff"/><rect x="16" y="16" width="448" height="64" rx="4" fill="#f6f7f9" stroke="#dfe3e8"/><rect x="16" y="16" width="56" height="64" rx="4" fill="#1d4ed8"/><text x="44" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">1</text><text x="90" y="54" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24">Register on the JoSAA portal</text><line x1="44" y1="80" x2="44" y2="106" stroke="#8a94a0" stroke-width="2"/><rect x="16" y="106" width="448" height="64" rx="4" fill="#f6f7f9" stroke="#dfe3e8"/><rect x="16" y="106" width="56" height="64" rx="4" fill="#1d4ed8"/><text x="44" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">2</text><text x="90" y="144" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24">Fill and lock your choices</text><line x1="44" y1="170" x2="44" y2="196" stroke="#8a94a0" stroke-width="2"/><rect x="16" y="196" width="448" height="64" rx="4" fill="#f6f7f9" stroke="#dfe3e8"/><rect x="16" y="196" width="56" height="64" rx="4" fill="#1d4ed8"/><text x="44" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">3</text><text x="90" y="234" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24">Check the mock allotments</text><line x1="44" y1="260" x2="44" y2="286" stroke="#8a94a0" stroke-width="2"/><rect x="16" y="286" width="448" height="64" rx="4" fill="#f6f7f9" stroke="#dfe3e8"/><rect x="16" y="286" width="56" height="64" rx="4" fill="#1d4ed8"/><text x="44" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">4</text><text x="90" y="324" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24">Get a round allotment: Freeze, Float or Slide</text><line x1="44" y1="350" x2="44" y2="376" stroke="#8a94a0" stroke-width="2"/><rect x="16" y="376" width="448" height="64" rx="4" fill="#f6f7f9" stroke="#dfe3e8"/><rect x="16" y="376" width="56" height="64" rx="4" fill="#1d4ed8"/><text x="44" y="416" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">5</text><text x="90" y="414" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24">Pay the fee and upload documents</text><line x1="44" y1="440" x2="44" y2="466" stroke="#8a94a0" stroke-width="2"/><rect x="16" y="466" width="448" height="64" rx="4" fill="#f6f7f9" stroke="#dfe3e8"/><rect x="16" y="466" width="56" height="64" rx="4" fill="#1d4ed8"/><text x="44" y="506" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">6</text><text x="90" y="504" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b1f24">Next round, or CSAB special rounds</text></svg>