<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 680" width="100%" height="auto" style="max-width:840px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Step 1: Seat Allotted -->
  <rect x="250" y="20" width="340" height="56" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
  <text x="420" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">1. Seat Allotted in JoSAA Round</text>
  <text x="420" y="62" text-anchor="middle" font-size="12" fill="#3b82f6">Download Initial Allotment Intimation Slip</text>

  <!-- Line 1 -> 2 -->
  <line x1="420" y1="76" x2="420" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: Pay Seat Acceptance Fee -->
  <rect x="240" y="110" width="360" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="420" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">2. Remit Seat Acceptance Fee (SAF)</text>
  <text x="420" y="152" text-anchor="middle" font-size="12" fill="#64748b">₹30,000 (GEN/OBC/EWS) · ₹15,000 (SC/ST/PwD)</text>
  <text x="420" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">Verification does not begin until SAF is paid</text>

  <!-- Branch: SAF Not Paid -->
  <line x1="600" y1="143" x2="668" y2="143" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)" />
  <rect x="670" y="118" width="150" height="50" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="745" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Fee Not Paid</text>
  <text x="745" y="155" text-anchor="middle" font-size="11" fill="#b91c1c">Seat Cancelled &amp; Exit</text>

  <!-- Line 2 -> 3 -->
  <line x1="420" y1="176" x2="420" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3: Upload Documents -->
  <rect x="220" y="210" width="400" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="420" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">3. Upload Mandatory Documents (PDF)</text>
  <text x="420" y="253" text-anchor="middle" font-size="12" fill="#64748b">Class 10, Class 12, Category/PwD, Medical &amp; Cheque</text>

  <!-- Line 3 -> 4 -->
  <line x1="420" y1="270" x2="420" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 4: Choose Willingness -->
  <rect x="240" y="304" width="360" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="420" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">4. Choose Willingness Option</text>
  <text x="420" y="347" text-anchor="middle" font-size="12" fill="#64748b">Select Freeze, Float, or Slide for future rounds</text>

  <!-- Line 4 -> 5 -->
  <line x1="420" y1="360" x2="420" y2="392" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 5: Online Document Verification -->
  <rect x="230" y="394" width="380" height="56" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
  <text x="420" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">5. Online Document Verification</text>
  <text x="420" y="437" text-anchor="middle" font-size="12" fill="#475569">Verifying Officer reviews uploaded certificates</text>

  <!-- Verification Split: All Valid vs Query Raised -->
  <!-- Direct Path down to Confirmed -->
  <line x1="420" y1="450" x2="420" y2="558" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="425" y="488" width="105" height="24" rx="4" fill="#f0fdf4" stroke="#86efac" />
  <text x="477" y="504" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">All Valid ✓</text>

  <!-- Path left to Query Raised -->
  <path d="M 230 422 L 140 422 L 140 478" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="145" y="435" width="85" height="22" rx="4" fill="#fffbeb" stroke="#fde68a" />
  <text x="187" y="450" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">Discrepancy</text>

  <!-- Query Box -->
  <rect x="30" y="480" width="220" height="68" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
  <text x="140" y="502" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Online Query Raised</text>
  <text x="140" y="520" text-anchor="middle" font-size="11" fill="#78350f">Check portal (48hr window)</text>
  <text x="140" y="536" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">Upload Undertaking / Doc</text>

  <!-- Query Resolved -> Joins Confirmed -->
  <path d="M 250 514 L 320 514 L 320 580 L 338 580" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="285" y="506" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Resolved ✓</text>

  <!-- Query No Response -> Cancelled / Retag -->
  <line x1="140" y1="548" x2="140" y2="598" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)" />
  <rect x="30" y="600" width="220" height="58" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="140" y="621" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">No Response / Invalid</text>
  <text x="140" y="637" text-anchor="middle" font-size="11" fill="#b91c1c">Seat Cancelled or</text>
  <text x="140" y="650" text-anchor="middle" font-size="11" fill="#b91c1c">Category Converted to OPEN (Cl. 74)</text>

  <!-- Step 6: Seat Confirmed -->
  <rect x="340" y="560" width="340" height="66" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
  <text x="510" y="586" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">6. Provisional Seat Confirmed</text>
  <text x="510" y="605" text-anchor="middle" font-size="12" fill="#166534">Download Confirmation Slip</text>
  <text x="510" y="620" text-anchor="middle" font-size="11" fill="#15803d">Proceed to next round or physical reporting</text>
</svg>
